name: Tests

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3"]
        laravel: ["10.*", "11.*", "12.*"]
        stability: ["prefer-stable"]
        exclude:
          # Laravel 11+ requires PHP 8.2+; already satisfied, but
          # Laravel 12 dropped support for some older testbench versions.
          - laravel: "12.*"
            php: "8.2"

    name: PHP ${{ matrix.php }} – Laravel ${{ matrix.laravel }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: redis
          coverage: none

      - name: Install dependencies
        run: |
          composer require "illuminate/contracts:${{ matrix.laravel }}" \
                           "illuminate/redis:${{ matrix.laravel }}" \
                           "illuminate/support:${{ matrix.laravel }}" \
                           --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      - name: Run tests
        env:
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          REDIS_DB: 9
        run: vendor/bin/pest --ci
